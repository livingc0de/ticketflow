# ticketflow:begin form
name: Feature Or Improvement
description: Propose a new capability or a meaningful improvement.
title: "[Feature]: "
labels:
  - "Type: Feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Or Opportunity
      description: What problem should be solved, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired Outcome
      description: The result, without prescribing the implementation unless necessary.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed Scope
      description: The minimum useful behavior.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out Of Scope
      description: Related behavior that should not be included yet.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies And Risks
      description: Decisions, legal input, external systems or sequencing constraints.
# ticketflow:end form
