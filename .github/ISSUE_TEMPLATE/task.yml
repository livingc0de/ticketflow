# ticketflow:begin form
name: Technical Task
description: Track engineering, testing, infrastructure, documentation or maintenance work.
title: "[Task]: "
labels:
  - "Type: Task"
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be changed or completed, and why?
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
      description: Constraints, likely files or a proposed approach, when known.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Scripts"
        - "Skills & Roles"
        - "Templates"
        - "Docs"
        - "Practices"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 Critical"
        - "P1 High"
        - "P2 Medium"
        - "P3 Low"
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The checks that must pass before the issue is done.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies And Risks
  - type: textarea
    id: execution
    attributes:
      label: Execution
      description: "A recommendation the implementer re-checks against the code: the tier (low, normal, high, critical), the model and effort, and the planning choice (planner: the planner runs at claim, the default; planned earlier: <path to the committed technical plan>; or skipped, easy and straightforward because (a)-(d)), each with a one-line reason."
      placeholder: |
        - **Tier:** normal - ...
        - **Model and effort:** standard class, high - ...
        - **Planning:** planner (runs at claim) - ...
# ticketflow:end form
