# ticketflow:begin form
name: Bug Report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - "Type: Bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and who is affected?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where it happened. Optional; edit the choices to match this repo's environments.
      options:
        - Production
        - Staging
        - Development
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Scripts"
        - "Skills & Roles"
        - "Templates"
        - "Docs"
        - "Practices"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 Critical"
        - "P1 High"
        - "P2 Medium"
        - "P3 Low"
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, links or file:line references. Remove secrets and personal data first.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] The problem can no longer be reproduced.
        - [ ] A test covers it.
    validations:
      required: true
  - type: textarea
    id: execution
    attributes:
      label: Execution
      description: "A recommendation the implementer re-checks against the code: the tier (low, normal, high, critical), the model and effort, and the planning choice (planner: the planner runs at claim, the default; planned earlier: <path to the committed technical plan>; or skipped, easy and straightforward because (a)-(d)), each with a one-line reason."
      placeholder: |
        - **Tier:** normal - ...
        - **Model and effort:** standard class, high - ...
        - **Planning:** planner (runs at claim) - ...
# ticketflow:end form
