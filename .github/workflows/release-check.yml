name: Release Check

# The release tag must pass the full suite, including the tag-only checks (the tag is v<VERSION>, CHANGELOG has a section).
# This is not the merge gate: CI / Gate is posted by ci.yml only.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep the version and sha256 in sync with the same step in ci.yml.
      - name: Install Actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run Tests
        run: npm test
        env:
          TICKETFLOW_REQUIRE_ACTIONLINT: '1'
