# ticketflow:begin form
name: Bug Report
description: Report a reproducible problem.
title: "[Bug]: "
labels:
  - "Type: Bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and who is affected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, links or file:line references. Remove secrets and personal data first.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] The problem can no longer be reproduced.
        - [ ] A test covers it.
    validations:
      required: true
# ticketflow:end form
