# ticketflow:begin form
name: Decision
description: Record a decision that blocks or materially changes delivery.
title: "[Decision]: "
labels:
  - "Type: Decision"
  - "Needs: Decision"
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision Needed
      description: The exact question that needs an answer.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context And Constraints
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options Considered
      description: The meaningful trade-offs of each option.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommended Default
      description: What implementers can assume until it is decided.
    validations:
      required: true
{{area_field}}
{{priority_field}}
  - type: input
    id: owner
    attributes:
      label: Decision Owner
      placeholder: GitHub username or role
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Recorded Outcome
      description: Completed after the decision is made, with the rationale and follow-up work.
{{execution_field}}
# ticketflow:end form
